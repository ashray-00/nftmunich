name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Connect Google membership automation
        run: |
          printf '%s' "$GOOGLE_SCRIPT_URL" | vercel env add GOOGLE_SCRIPT_URL production --force --token=${{ secrets.VERCEL_TOKEN }}
          printf '%s' "$GOOGLE_SCRIPT_SHARED_SECRET" | vercel env add GOOGLE_SCRIPT_SHARED_SECRET production --force --sensitive --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GOOGLE_SCRIPT_URL: https://script.google.com/macros/s/AKfycbxgGGV5UfABGnNrMoLZqjosM0w1ITVDMTOfHtJc6Xtq8LxfZ5NZDL0TfhJXUquxzVvmnA/exec
          GOOGLE_SCRIPT_SHARED_SECRET: ${{ secrets.GOOGLE_SCRIPT_SHARED_SECRET }}

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
